<main class="min-h-dvh bg-[var(--theme-canvas)] px-5 py-8 text-[var(--theme-foreground)] sm:px-8 sm:py-12">
  <section class="mx-auto w-full max-w-5xl">
    <header class="flex flex-wrap items-center justify-between gap-5">
      <div>
        <h1 class="text-3xl font-semibold tracking-tight sm:text-4xl">Mi espacio</h1>
        <p class="mt-2 text-sm text-[var(--theme-muted)]">Hola, {{ currentUser()?.nombre ?? 'estudiante' }}.</p>
      </div>

      <button
        type="button"
        (click)="logout()"
        class="flex min-h-11 cursor-pointer items-center justify-center gap-2 rounded-[14px] border border-[var(--theme-border)] px-4 py-2 text-sm font-medium text-[var(--theme-foreground)] transition-[transform,background-color] duration-150 hover:scale-[0.99] hover:bg-[var(--theme-surface)] active:scale-[1.01] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[var(--theme-accent-content)] motion-reduce:transition-none"
      >
        <span class="material-symbols-rounded text-lg" aria-hidden="true">logout</span>
        Cerrar sesión
      </button>
    </header>

    <app-subject-list class="mt-12" />
  </section>
</main>
