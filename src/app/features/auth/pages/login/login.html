<main class="grid min-h-dvh bg-[var(--theme-canvas)] p-3 pb-20 sm:p-4 sm:pb-20 md:grid-cols-[minmax(0,0.95fr)_minmax(340px,1.05fr)] md:pb-4">
  <app-auth-hero />

  <section class="relative flex min-w-0 items-center justify-center px-3 py-16 sm:px-8 md:px-5 xl:px-12" aria-label="Iniciar sesión" style="--text-field-label-background: var(--theme-canvas)">
    <a
      routerLink="/"
      class="group absolute top-4 left-4 inline-flex min-h-11 items-center gap-2 rounded-lg text-xs font-medium text-[var(--theme-muted)] outline-offset-4 transition-colors hover:text-[var(--theme-foreground)] focus-visible:outline-2 focus-visible:outline-[var(--theme-accent)] md:left-5 xl:left-12"
    >
      <span class="material-symbols-rounded text-base transition-transform duration-200 group-hover:-translate-x-1 group-focus-visible:-translate-x-1 motion-reduce:transition-none" aria-hidden="true">arrow_back</span>
      Volver al inicio
    </a>
    <div class="w-full max-w-[420px]" appAuthFormReveal>
      <p [class]="'text-[10px] font-semibold uppercase tracking-[0.2em] ' + appearance.brand">
        Qué bueno verte de nuevo
      </p>
      <h1 class="mt-4 text-3xl font-semibold leading-tight tracking-[-0.045em] text-[var(--theme-foreground)] sm:text-4xl">
        Iniciar sesión
      </h1>
      <p [class]="'mt-3 text-sm leading-relaxed ' + appearance.muted">
        Tus materias, apuntes y próximos pasos.
      </p>

      <form
        [formGroup]="form"
        (ngSubmit)="submit()"
        [attr.aria-busy]="action.pending()"
        class="mt-8 space-y-5"
      >
        <app-text-field
          id="login-email"
          label="Correo electrónico"
          type="email"
          autocomplete="username"
          placeholder="tu@correo.com"
          [required]="true"
          [maxLength]="254"
          [errorText]="emailErrorMessage()"
          formControlName="email"
        />

        <app-text-field
          id="login-password"
          label="Contraseña"
          type="password"
          autocomplete="current-password"
          placeholder="Tu contraseña"
          [required]="true"
          [maxLength]="72"
          [revealable]="true"
          [errorText]="passwordErrorMessage()"
          formControlName="password"
        />

        @if (action.errorMessage()) {
          <p role="alert" [class]="'rounded-xl p-3 text-sm ' + appearance.error">
            {{ action.errorMessage() }}
          </p>
        }

        <button
          type="submit"
          [disabled]="action.disabled()"
          [class]="
            'mt-2 flex min-h-12 w-full cursor-pointer items-center justify-center gap-2 px-4 py-3 text-sm font-semibold transition-[filter,transform] duration-150 hover:brightness-110 active:translate-y-px focus-visible:outline-2 focus-visible:outline-offset-4 disabled:cursor-not-allowed disabled:opacity-60 motion-reduce:transition-none ' +
            appearance.button
          "
        >
          @if (action.pending()) {
            Ingresando…
          } @else if (action.remainingSeconds() > 0) {
            Esperá {{ action.remainingSeconds() }} segundos
          } @else {
            Iniciar sesión
          }
        </button>
      </form>

      <p [class]="'mt-7 text-center text-[13px] leading-relaxed ' + appearance.muted">
        ¿Primera vez acá?
        <a
          routerLink="/register"
          [class]="'ml-1 font-semibold underline underline-offset-4 ' + appearance.link"
        >
          Crear cuenta
        </a>
      </p>
    </div>
  </section>
</main>
