<section
  data-auth-form
  class="mx-auto w-full max-w-[420px]"
  aria-label="Iniciar sesión"
  style="--text-field-label-background: var(--theme-canvas)"
  appAuthFormReveal
>
      <app-buho
        data-reveal-item
        class="-mb-1 -ml-4 block w-fit"
        [estado]="estadoBuho()"
        [mirada]="miradaBuho()"
        [espiando]="espiando()"
      />
      <h1 data-reveal-item class="text-3xl font-semibold leading-tight tracking-[-0.045em] text-[var(--theme-foreground)] sm:text-4xl">
        Iniciar sesión
      </h1>
      <p data-reveal-item [class]="'mt-3 text-sm leading-relaxed ' + appearance.muted">
        Tus materias, apuntes y próximos pasos.
      </p>

      <form
        [formGroup]="form"
        (ngSubmit)="submit()"
        [attr.aria-busy]="action.pending()"
        class="mt-8 space-y-5"
      >
        <app-text-field
          data-reveal-item
          id="login-email"
          label="Correo electrónico"
          type="email"
          autocomplete="username"
          placeholder="tu@correo.com"
          [required]="true"
          [maxLength]="254"
          [errorText]="emailErrorMessage()"
          formControlName="email"
          (focusin)="enfocarEmail()"
          (focusout)="desenfocar()"
          (input)="escribirEmail()"
        />

        <app-text-field
          data-reveal-item
          id="login-password"
          label="Contraseña"
          type="password"
          autocomplete="current-password"
          placeholder="Tu contraseña"
          [required]="true"
          [maxLength]="72"
          [revealable]="true"
          [errorText]="passwordErrorMessage()"
          formControlName="password"
          (focusin)="enfocarPassword()"
          (focusout)="desenfocar()"
          (click)="revisarEspia($event)"
        />

        @if (action.errorMessage()) {
          <p role="alert" [class]="'rounded-xl p-3 text-sm ' + appearance.error">
            {{ action.errorMessage() }}
          </p>
        }

        <button
          data-reveal-item
          type="submit"
          [disabled]="action.disabled()"
          [class]="
            'mt-2 flex min-h-12 w-full cursor-pointer items-center justify-center gap-2 px-4 py-3 text-sm font-semibold transition-[filter,transform] duration-150 hover:brightness-110 active:translate-y-px focus-visible:outline-2 focus-visible:outline-offset-4 disabled:cursor-not-allowed disabled:opacity-60 motion-reduce:transition-none ' +
            appearance.button
          "
        >
          @if (action.pending()) {
            Ingresando…
          } @else if (action.remainingSeconds() > 0) {
            Esperá {{ action.remainingSeconds() }} segundos
          } @else {
            Iniciar sesión
          }
        </button>
      </form>

      <p data-reveal-item [class]="'mt-7 text-center text-[13px] leading-relaxed ' + appearance.muted">
        ¿Primera vez acá?
        <a
          href="/register"
          (click)="navigateToRegister($event)"
          [class]="'ml-1 font-semibold underline underline-offset-4 ' + appearance.link"
        >
          Crear cuenta
        </a>
      </p>
</section>
