<aside
  class="relative flex min-h-[240px] flex-col justify-between overflow-hidden rounded-[26px] bg-[var(--theme-surface)] p-6 sm:p-8 md:min-h-[calc(100dvh-2rem)] md:p-7 lg:p-10 xl:p-12"
  aria-label="Acadezer, tu espacio de estudio"
>
  <div
    data-hero-brand
    class="relative z-10 flex w-fit items-center gap-2.5"
  >
    <span [class]="'flex size-10 items-center justify-center ' + appearance.mark">
      <span class="material-symbols-rounded text-[22px]" aria-hidden="true">menu_book</span>
    </span>
    <span [class]="'text-lg font-semibold tracking-[-0.04em] ' + appearance.foreground">
      acadezer<span [class]="appearance.brand">.</span>
    </span>
  </div>

  <div class="relative z-10 mt-10 max-w-2xl md:my-auto md:py-10">
    <div data-hero-copy>
      <h2 class="max-w-xl text-[clamp(1.8rem,3.2vw,3.25rem)] font-semibold leading-[1.08] tracking-[-0.05em] text-[var(--theme-foreground)]">
        Todo lo que estudiás, en un solo lugar.
      </h2>
      <p [class]="'mt-5 max-w-md text-sm leading-6 sm:text-base ' + appearance.muted">
        Organizá tus materias, convertí tus apuntes en preguntas y seguí tu avance sin perder el hilo.
      </p>
    </div>

    <!-- Contenedor con el búho apoyado sobre la tarjeta de estudio -->
    <div data-study-flow class="relative mt-8 w-full max-w-[440px]">
      <!-- Búho con las garras agarradas del borde superior de la tarjeta -->
      <div class="relative z-20 -mb-[14px] flex justify-center">
        <app-buho
          class="block size-[135px] sm:size-[150px]"
          [estado]="buhoState.estado()"
          [mirada]="buhoState.mirada()"
          [espiando]="buhoState.espiando()"
          [conRama]="false"
        />
      </div>

      <!-- Tarjeta original estática "Así se organiza tu estudio" -->
      <figure class="relative z-10 w-full rounded-[24px] bg-[var(--theme-canvas)] p-4 sm:p-5 border border-[var(--theme-border)]/50">
        <div class="flex items-center gap-3">
          <span [class]="'flex size-11 shrink-0 items-center justify-center rounded-[15px] ' + appearance.mark">
            <span class="material-symbols-rounded text-[22px]" aria-hidden="true">edit_note</span>
          </span>
          <div class="min-w-0">
            <p class="text-sm font-semibold text-[var(--theme-foreground)]">Así se organiza tu estudio</p>
            <p [class]="'mt-0.5 text-xs ' + appearance.muted">De la materia a la práctica</p>
          </div>
        </div>

        <div class="mt-4 grid grid-cols-3 gap-2" role="list" aria-label="Etapas de estudio">
          <div class="min-w-0 rounded-[16px] bg-[var(--theme-surface-high)] p-3 text-[var(--theme-muted)] sm:p-4">
            <span class="material-symbols-rounded block text-[22px]" aria-hidden="true">menu_book</span>
            <span class="mt-2 block truncate text-xs font-semibold sm:text-[13px]">Materias</span>
          </div>

          <div class="min-w-0 rounded-[16px] bg-[var(--theme-surface-high)] p-3 text-[var(--theme-muted)] sm:p-4">
            <span class="material-symbols-rounded block text-[22px]" aria-hidden="true">description</span>
            <span class="mt-2 block truncate text-xs font-semibold sm:text-[13px]">Apuntes</span>
          </div>

          <div class="min-w-0 rounded-[16px] bg-[var(--theme-accent-soft)] p-3 text-[var(--theme-foreground)] sm:p-4">
            <span class="material-symbols-rounded block text-[22px]" aria-hidden="true">quiz</span>
            <span class="mt-2 block truncate text-xs font-semibold sm:text-[13px]">Preguntas</span>
          </div>
        </div>

        <div class="mt-4 h-1 overflow-hidden rounded-full bg-[var(--theme-surface-high)]" aria-hidden="true">
          <span class="block h-full w-full rounded-full bg-[var(--theme-accent)]"></span>
        </div>

        <p class="mt-3 min-h-5 text-xs leading-5 text-[var(--theme-muted)]">
          Convertí lo que leíste en preguntas para repasar.
        </p>
      </figure>
    </div>
  </div>
</aside>
