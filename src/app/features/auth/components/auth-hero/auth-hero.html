<aside
  class="relative flex min-h-[240px] flex-col justify-between overflow-hidden rounded-[26px] bg-[var(--theme-surface)] p-6 sm:p-8 md:min-h-[calc(100dvh-2rem)] md:p-7 lg:p-10 xl:p-12"
  aria-label="Acadezer, tu espacio de estudio"
>
  <div
    data-hero-brand
    class="relative z-10 flex w-fit items-center gap-2.5"
  >
    <span [class]="'flex size-10 items-center justify-center ' + appearance.mark">
      <span class="material-symbols-rounded text-[22px]" aria-hidden="true">menu_book</span>
    </span>
    <span [class]="'text-lg font-semibold tracking-[-0.04em] ' + appearance.foreground">
      acadezer<span [class]="appearance.brand">.</span>
    </span>
  </div>

  <div class="relative z-10 mt-10 max-w-2xl md:my-auto md:py-10">
    <div data-hero-copy>
      <h2 class="max-w-xl text-[clamp(1.8rem,3.2vw,3.25rem)] font-semibold leading-[1.08] tracking-[-0.05em] text-[var(--theme-foreground)]">
        Todo lo que estudiás, en un solo lugar.
      </h2>
      <p [class]="'mt-5 max-w-md text-sm leading-6 sm:text-base ' + appearance.muted">
        Organizá tus materias, convertí tus apuntes en preguntas y seguí tu avance sin perder el hilo.
      </p>
    </div>

    <div
      data-buho-card
      class="mt-7 flex w-full max-w-[440px] flex-col items-center rounded-[24px] bg-[var(--theme-canvas)] p-5 sm:p-6 border border-[var(--theme-border)]/40 shadow-xs"
    >
      <!-- Cabecera del compañero de estudio -->
      <div class="flex w-full items-center justify-between pb-1">
        <div class="flex items-center gap-2.5">
          <span [class]="'flex size-10 shrink-0 items-center justify-center rounded-[13px] ' + appearance.mark">
            <span class="material-symbols-rounded text-[20px]" aria-hidden="true">school</span>
          </span>
          <div>
            <p class="text-sm font-semibold text-[var(--theme-foreground)]">Tu copiloto de estudio</p>
            <p [class]="'text-xs ' + appearance.muted">Atento a cada paso de tu aprendizaje</p>
          </div>
        </div>

        <span class="inline-flex items-center gap-1.5 rounded-full bg-[var(--theme-surface-high)] px-2.5 py-1 text-xs font-medium text-[var(--theme-muted)]">
          <span class="size-2 rounded-full bg-[var(--theme-accent)] animate-pulse" aria-hidden="true"></span>
          En vivo
        </span>
      </div>

      <!-- Contenedor del Búho apoyado -->
      <div class="relative mt-3 flex w-full flex-col items-center justify-center">
        <!-- Burbuja de diálogo contextual que reacciona a los formularios -->
        <div class="relative mb-1 max-w-[280px] rounded-[16px] bg-[var(--theme-surface-high)] px-4 py-2 text-center text-xs font-medium text-[var(--theme-foreground)] shadow-2xs border border-[var(--theme-border)]/30">
          {{ buhoMensaje() }}
          <!-- Piquito de la burbuja hacia abajo -->
          <span class="absolute -bottom-1.5 left-1/2 -translate-x-1/2 size-0 border-x-[6px] border-t-[6px] border-x-transparent border-t-[var(--theme-surface-high)]" aria-hidden="true"></span>
        </div>

        <!-- Búho -->
        <div class="relative flex items-center justify-center">
          <app-buho
            class="block"
            [estado]="buhoState.estado()"
            [mirada]="buhoState.mirada()"
            [espiando]="buhoState.espiando()"
          />
        </div>

        <!-- Pedestal / repisa de estudio debajo de la rama para asentar el conjunto -->
        <div class="-mt-3 flex w-full max-w-[200px] flex-col items-center" aria-hidden="true">
          <div class="h-2 w-44 rounded-full bg-[var(--theme-surface-high)] border border-[var(--theme-border)]/40 shadow-xs"></div>
          <div class="h-1 w-28 rounded-full bg-[var(--theme-border)]/30 mt-0.5"></div>
        </div>
      </div>
    </div>
  </div>
</aside>
