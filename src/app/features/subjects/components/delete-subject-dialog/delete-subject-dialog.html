<app-modal
  [title]="'¿Eliminar ' + subject().nombre + '?'"
  [pending]="action.pending()"
  (closed)="cancelled.emit()"
>
  <div class="space-y-4">
    <div class="flex items-start gap-3 rounded-[16px] bg-red-500/10 p-4 dark:bg-red-500/15">
      <span class="material-symbols-rounded shrink-0 text-xl text-[var(--theme-error)]" aria-hidden="true">delete_forever</span>
      <p class="text-sm leading-relaxed text-[var(--theme-foreground)]">
        Se eliminarán también sus apuntes, pendientes, evaluaciones y asistencias. No vas a poder recuperar este contenido.
      </p>
    </div>

    @if (action.errorMessage()) {
      <p role="alert" [class]="errorSurfaceClass">{{ action.errorMessage() }}</p>
    }

    <div class="flex flex-col-reverse gap-3 pt-1 sm:flex-row sm:justify-end">
      <button type="button" [class]="secondaryButtonClass" [disabled]="action.pending()" (click)="close()">
        Cancelar
      </button>
      <button type="button" [class]="dangerButtonClass" [disabled]="action.disabled()" (click)="confirm()">
        @if (action.pending()) {
          Eliminando…
        } @else {
          Eliminar materia
        }
      </button>
    </div>
  </div>
</app-modal>
