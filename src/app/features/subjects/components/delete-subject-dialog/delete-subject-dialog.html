<app-modal
  [title]="'¿Eliminar ' + subject().nombre + '?'"
  [description]="cascadeWarning"
  [pending]="action.pending()"
  (closed)="cancelled.emit()"
>
  <div class="space-y-4">
    <div class="flex items-start gap-3 rounded-[14px] border border-[var(--theme-error)] p-3">
      <span class="material-symbols-rounded shrink-0 text-[var(--theme-error)]" aria-hidden="true">delete_forever</span>
      <p class="text-sm leading-relaxed text-[var(--theme-muted)]">
        Se borra todo el contenido vinculado a esta materia. Si querés conservar el material, cancelá y revisá la materia antes de eliminarla.
      </p>
    </div>

    @if (action.errorMessage()) {
      <p role="alert" [class]="errorSurfaceClass">{{ action.errorMessage() }}</p>
    }

    <div class="flex flex-col-reverse gap-3 pt-1 sm:flex-row sm:justify-end">
      <button type="button" [class]="secondaryButtonClass" [disabled]="action.pending()" (click)="cancelled.emit()">
        Cancelar
      </button>
      <button type="button" [class]="dangerButtonClass" [disabled]="action.disabled()" (click)="confirm()">
        @if (action.pending()) {
          Eliminando…
        } @else {
          Eliminar materia
        }
      </button>
    </div>
  </div>
</app-modal>
