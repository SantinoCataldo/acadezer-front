<div class="rounded-[18px] bg-[var(--theme-canvas)]">
  <div
    role="toolbar"
    aria-label="Formato del texto"
    aria-controls="apunte-contenido"
    class="mx-3 mt-2 flex flex-wrap items-center gap-1.5 rounded-full bg-[var(--theme-surface-high)] px-3 py-1 sm:gap-2 sm:px-4 sm:py-1.5"
  >
    @for (action of toolbar; track action.label) {
      <button
        type="button"
        [attr.aria-label]="action.label"
        [attr.title]="action.label"
        [attr.aria-pressed]="action.stateCommand || action.command === 'formatBlock' ? isActive(action) : null"
        class="flex size-9 cursor-pointer items-center justify-center rounded-full text-[var(--theme-muted)] transition-[background-color,color,transform] duration-150 hover:bg-[var(--theme-canvas)] hover:text-[var(--theme-foreground)] active:scale-[0.96] aria-pressed:bg-[var(--theme-accent)] aria-pressed:text-[var(--theme-on-accent)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--theme-accent-content)] motion-reduce:transition-none"
        (pointerdown)="preserveSelection($event)"
        (click)="apply(action)"
      >
        <span class="material-symbols-rounded text-[20px]" aria-hidden="true">{{ action.icon }}</span>
      </button>
    }
  </div>

  <div class="mx-2 mt-2 border-b border-[var(--theme-border)] sm:mx-3" aria-hidden="true"></div>

  <div
    #editable
    id="apunte-contenido"
    class="note-content min-h-52 w-full px-3 pb-2 pt-4 text-sm leading-relaxed text-[var(--theme-foreground)] outline-none"
    contenteditable="true"
    role="textbox"
    aria-multiline="true"
    [attr.aria-label]="placeholder()"
    [attr.aria-invalid]="invalid() || null"
    [attr.data-placeholder]="placeholder()"
    [attr.data-focused]="focused() || null"
    (input)="onInput()"
    (blur)="onBlur()"
    (focus)="focused.set(true)"
  ></div>
</div>

@if (invalid()) {
  <p role="alert" class="mt-2 text-sm text-[var(--theme-error)]">
    {{ errorText() }}
  </p>
}
