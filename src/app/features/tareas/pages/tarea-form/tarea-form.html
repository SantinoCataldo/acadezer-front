<section class="mx-auto w-full max-w-lg text-[var(--theme-foreground)]">
  <h2 class="text-xl font-semibold sm:text-2xl">{{ id ? 'Editar tarea' : 'Nueva tarea' }}</h2>

  @if (id && loading()) {
    <p role="status" class="mt-6 rounded-[16px] bg-[var(--theme-surface)] px-4 py-5 text-sm text-[var(--theme-muted)]">
      Cargando tarea…
    </p>
  } @else if (id && loadError()) {
    <div role="alert" class="mt-6 rounded-[16px] bg-[var(--md-sys-color-error-container)] px-4 py-4 text-sm text-[var(--md-sys-color-on-error-container)]">
      <p>{{ loadError() }}</p>
      <button type="button" (click)="cargarTarea()" class="mt-3 min-h-11 cursor-pointer rounded-[12px] px-3 font-semibold hover:bg-black/5 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--theme-accent-content)]">
        Reintentar
      </button>
    </div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-6 space-y-5">
      <app-text-field
        id="task-title"
        label="Título"
        formControlName="titulo"
        [required]="true"
        [maxLength]="200"
        [errorText]="form.controls.titulo.touched && form.controls.titulo.hasError('required') ? 'El título es obligatorio.' : form.controls.titulo.touched && form.controls.titulo.hasError('maxlength') ? 'El título puede tener hasta 200 caracteres.' : null"
      />

      <app-text-field
        id="task-description"
        label="Descripción (opcional)"
        formControlName="descripcion"
        [multiline]="true"
        [rows]="4"
        [maxLength]="2000"
        [errorText]="form.controls.descripcion.touched && form.controls.descripcion.hasError('maxlength') ? 'La descripción puede tener hasta 2000 caracteres.' : null"
      />

      <div>
        <label for="task-due-date" class="mb-2 block text-sm font-medium">Fecha de entrega (opcional)</label>
        <div>
          <app-date-picker
            id="task-due-date"
            formControlName="fechaLimite"
            label="Fecha de entrega"
          />
        </div>
      </div>

      @if (submitError()) {
        <p role="alert" class="rounded-[14px] bg-[var(--md-sys-color-error-container)] px-4 py-3 text-sm text-[var(--md-sys-color-on-error-container)]">
          {{ submitError() }}
        </p>
      }

      <div class="flex flex-wrap gap-3">
        <button
          type="submit"
          [disabled]="saving()"
          class="min-h-11 cursor-pointer rounded-[14px] bg-[var(--theme-accent)] px-4 py-3 text-sm font-semibold text-[var(--theme-on-accent)] transition-transform duration-150 hover:scale-[0.99] active:scale-[1.01] disabled:cursor-wait disabled:opacity-60 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--theme-accent-content)] motion-reduce:transition-none"
        >
          {{ saving() ? 'Guardando…' : 'Guardar tarea' }}
        </button>
        <a
          [routerLink]="['/estudio/tareas']"
          [queryParams]="{ materia: materiaId }"
          class="inline-flex min-h-11 items-center rounded-[14px] px-4 py-3 text-sm font-semibold text-[var(--theme-muted)] transition-transform duration-150 hover:scale-[0.99] hover:bg-[var(--theme-surface)] active:scale-[1.01] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--theme-accent-content)] motion-reduce:transition-none"
        >
          Cancelar
        </a>
      </div>
    </form>
  }
</section>
