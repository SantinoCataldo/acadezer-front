<app-modal
  [title]="editing() ? 'Editar evaluación' : 'Nueva evaluación'"
  [description]="editing() ? ('Materia: ' + nombreMateriaActual()) : 'Cargá los datos del examen o entrega.'"
  [pending]="action.pending()"
  (closed)="cancelled.emit()"
>
  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    [attr.aria-busy]="action.pending()"
    novalidate
    class="space-y-4"
    style="--text-field-label-background: var(--theme-modal-surface)"
  >
    @if (materias().length > 1 && !editing()) {
      <div>
        <label for="evaluacion-materia" class="mb-1.5 block text-xs font-medium text-[var(--theme-muted)]">
          Materia
        </label>
        <app-select
          id="evaluacion-materia"
          [options]="opcionesMateria()"
          formControlName="materiaId"
        />
      </div>
    }

    <app-text-field
      id="evaluacion-nombre"
      label="Nombre de la evaluación"
      [required]="true"
      [maxLength]="nombreMax"
      [errorText]="nombreError()"
      formControlName="nombre"
    />

    <app-date-picker
      id="evaluacion-fecha"
      label="Fecha"
      [required]="true"
      [errorText]="fechaError()"
      formControlName="fecha"
    />

    <div class="grid gap-4 sm:grid-cols-2">
      <div>
        <label for="evaluacion-tipo" class="mb-1.5 block text-xs font-medium text-[var(--theme-muted)]">
          Tipo
        </label>
        <app-select
          id="evaluacion-tipo"
          [options]="opcionesTipo"
          formControlName="tipo"
        />
      </div>

      <div>
        <label for="evaluacion-estado" class="mb-1.5 block text-xs font-medium text-[var(--theme-muted)]">
          Estado
        </label>
        <app-select
          id="evaluacion-estado"
          [options]="opcionesEstado"
          formControlName="estado"
        />
      </div>
    </div>

    <div>
      <app-text-field
        id="evaluacion-nota"
        label="Nota (0 a 10, opcional)"
        [errorText]="notaError()"
        [maxLength]="notaLength"
        inputMode="decimal"
        supportingText="Dejalo vacío si aún no la rendiste. ≥6 = Aprobado, <6 = Desaprobado."
      />
    </div>

    @if (action.errorMessage(); as message) {
      <p
        class="rounded-[14px] bg-[var(--md-sys-color-error-container)] p-3 text-sm text-[var(--md-sys-color-on-error-container)]"
        aria-live="polite"
      >
        {{ message }}
      </p>
    }

    <div class="flex flex-col-reverse gap-2 pt-2 sm:flex-row">
      <button
        type="button"
        [class]="secondaryButtonClass"
        [disabled]="action.pending()"
        (click)="close()"
      >
        Cancelar
      </button>
      <button type="submit" [class]="primaryButtonClass" [disabled]="action.disabled()">
        {{ editing() ? 'Guardar cambios' : 'Crear evaluación' }}
      </button>
    </div>
  </form>
</app-modal>
