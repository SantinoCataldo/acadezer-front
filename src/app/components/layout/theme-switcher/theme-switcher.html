<ng-template #preferencesPanel>
  <section
    [class]="'theme-panel overflow-y-auto overscroll-contain rounded-[20px] bg-[var(--theme-surface-high)] p-4 text-[var(--theme-foreground)] ' + (embedded() ? 'theme-panel-embedded relative max-h-none w-full' : 'absolute right-0 bottom-14 max-h-[calc(100dvh-6rem)] w-[min(18rem,calc(100vw-2rem))]')"
    aria-label="Preferencias de apariencia"
  >
    <h2 class="text-sm font-semibold">Tema</h2>
    <p class="mt-1 text-xs leading-relaxed text-[var(--theme-muted)]">Ajustá los colores para toda la aplicación.</p>

    <fieldset class="mt-4">
      <legend class="text-xs font-medium">Paleta</legend>
      <div [class]="'mt-2 grid w-full grid-cols-4 gap-2 ' + (embedded() ? 'max-w-64' : 'max-w-56')">
        @for (seed of seeds; track seed.color) {
          <button
            type="button"
            (click)="selectSeed(seed)"
            [attr.aria-label]="'Paleta ' + seed.label"
            [attr.aria-pressed]="preferences.variant() === 'tonalSpot' && preferences.seed() === seed.color"
            [style.background]="seed.swatch"
            [class]="'palette-swatch relative min-w-0 cursor-pointer overflow-hidden border border-white/35 shadow-[inset_0_1px_2px_rgba(255,255,255,0.45),0_2px_8px_rgba(0,0,0,0.16)] outline-offset-2 sm:hover:shadow-[inset_0_1px_2px_rgba(255,255,255,0.55),0_5px_12px_rgba(0,0,0,0.22)] focus-visible:outline-2 focus-visible:outline-[var(--theme-foreground)] aria-pressed:scale-[1.03] aria-pressed:ring-2 aria-pressed:ring-[var(--theme-foreground)] aria-pressed:ring-offset-2 aria-pressed:ring-offset-[var(--theme-surface-high)] ' + (embedded() ? 'size-14' : 'size-12')"
          >
            @if (preferences.variant() === 'tonalSpot' && preferences.seed() === seed.color) {
              <span class="absolute right-1.5 bottom-1.5 flex size-5 items-center justify-center rounded-full bg-white text-slate-950 shadow-sm" aria-hidden="true">
                <span class="material-symbols-rounded text-sm">check</span>
              </span>
            }
          </button>
        }
        <button
          type="button"
          (click)="selectMonochrome()"
          aria-label="Paleta blanco y negro"
          [attr.aria-pressed]="preferences.variant() === 'monochrome'"
          [style.background]="'radial-gradient(circle at 30% 24%, #FFFFFF 0%, #D9D9DD 35%, #77777B 54%, #19171B 72%, #030304 100%)'"
          [class]="'palette-swatch relative min-w-0 cursor-pointer overflow-hidden border border-white/35 shadow-[inset_0_2px_3px_rgba(255,255,255,0.45),0_4px_10px_rgba(0,0,0,0.16)] outline-offset-2 focus-visible:outline-2 focus-visible:outline-[var(--theme-foreground)] aria-pressed:scale-[1.03] aria-pressed:ring-2 aria-pressed:ring-[var(--theme-foreground)] aria-pressed:ring-offset-2 aria-pressed:ring-offset-[var(--theme-surface-high)] ' + (embedded() ? 'size-14' : 'size-12')"
        >
          @if (preferences.variant() === 'monochrome') {
            <span
              class="absolute right-1.5 bottom-1.5 flex size-5 items-center justify-center rounded-full shadow-sm"
              [class.bg-white]="!preferences.isDark()"
              [class.text-slate-950]="!preferences.isDark()"
              [class.bg-slate-950]="preferences.isDark()"
              [class.text-white]="preferences.isDark()"
              aria-hidden="true"
            >
              <span class="material-symbols-rounded text-sm">check</span>
            </span>
          }
        </button>
      </div>
    </fieldset>

    <fieldset class="mt-4">
      <legend class="text-xs font-medium">Modo</legend>
      <div class="mt-2 grid grid-cols-3 gap-1 rounded-xl bg-[var(--theme-canvas)] p-1">
        @for (mode of modes; track mode.id) {
          <button
            type="button"
            (click)="preferences.setMode(mode.id)"
            [attr.aria-pressed]="preferences.mode() === mode.id"
            class="min-h-11 cursor-pointer rounded-lg px-2 text-xs outline-offset-2 focus-visible:outline-2 focus-visible:outline-[var(--theme-foreground)] aria-pressed:bg-[var(--theme-surface)] aria-pressed:font-semibold"
          >
            {{ mode.label }}
          </button>
        }
      </div>
    </fieldset>
  </section>
</ng-template>

@if (embedded()) {
  <ng-container [ngTemplateOutlet]="preferencesPanel" />
} @else {
  <details #themeDisclosure class="fixed right-5 bottom-5 z-50">
    <summary
      (click)="handleSummaryClick($event, themeDisclosure)"
      class="theme-trigger flex size-12 cursor-pointer list-none items-center justify-center rounded-full bg-[var(--theme-accent)] text-[var(--theme-on-accent)] shadow-lg outline-offset-4 focus-visible:outline-2"
      aria-label="Personalizar colores y tema"
      title="Personalizar apariencia"
    >
      <span class="material-symbols-rounded" aria-hidden="true">palette</span>
    </summary>
    <ng-container [ngTemplateOutlet]="preferencesPanel" />
  </details>
}
