<div class="relative block w-full">
  <button
    #triggerBtn
    type="button"
    [id]="id()"
    [disabled]="disabled()"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="listbox"
    (click)="toggle()"
    class="group flex min-h-10 w-full cursor-pointer items-center justify-between rounded-[12px] border border-[var(--theme-border)]/70 bg-transparent px-3 text-sm font-medium text-[var(--theme-foreground)] transition-[background-color,border-color,transform] duration-150 hover:border-[var(--theme-border)] hover:bg-[var(--theme-foreground)]/[0.04] active:scale-[0.99] disabled:cursor-not-allowed disabled:opacity-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--theme-accent-content)] motion-reduce:transition-none"
  >
    <span class="inline-flex items-center gap-2 font-medium" [class.text-[var(--theme-muted)]]="!displayTime()">
      <span class="material-symbols-rounded text-[18px] text-[var(--theme-muted)] transition-colors group-hover:text-[var(--theme-foreground)]" aria-hidden="true">
        schedule
      </span>
      <span>{{ displayTime() ?? placeholder() }}</span>
    </span>

    <span class="material-symbols-rounded text-base text-[var(--theme-muted)] transition-transform duration-150" [class.rotate-180]="isOpen()" aria-hidden="true">
      expand_more
    </span>
  </button>

  @if (isOpen()) {
    @if (isMobile()) {
      <div
        class="fixed inset-0 z-[100] bg-black/60 backdrop-blur-xs"
        aria-hidden="true"
        (click)="close()"
      ></div>

      <div
        #bottomSheetEl
        role="dialog"
        aria-label="Elegir horario"
        class="fixed inset-x-0 bottom-0 z-[101] max-h-[80vh] w-full overflow-y-auto rounded-t-[28px] border-t border-[var(--theme-border)]/50 bg-[var(--theme-surface)] p-5 pb-8 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]"
      >
        <div class="mx-auto mb-3 h-1.5 w-12 rounded-full bg-[var(--theme-muted)]/30"></div>

        <div class="flex items-center justify-between pb-3">
          <div>
            <h3 class="text-base font-semibold text-[var(--theme-foreground)]">{{ label() }}</h3>
            <p class="text-xs text-[var(--theme-muted)]">Formato 24 horas</p>
          </div>
          <span class="rounded-[10px] bg-[var(--theme-surface-high)] px-3 py-1 text-sm font-bold text-[var(--theme-accent-content)]">
            {{ displayTime() ?? '08:00' }}
          </span>
        </div>

        <div class="mt-2 flex gap-1.5 border-b border-[var(--theme-border)]/40 pb-3">
          @for (m of ['00', '15', '30', '45']; track m) {
            <button
              type="button"
              (click)="setMinutes(m)"
              class="min-h-9 flex-1 cursor-pointer rounded-[9px] bg-[var(--theme-surface-high)] text-xs font-semibold text-[var(--theme-foreground)] hover:brightness-105 active:scale-95"
            >
              :{{ m }}
            </button>
          }
        </div>

        <div role="listbox" class="mt-3 space-y-1 no-scrollbar max-h-72 overflow-y-auto">
          @for (slot of timeSlots(); track slot) {
            <button
              type="button"
              role="option"
              [attr.aria-selected]="value() === slot"
              (click)="selectTime(slot)"
              class="flex min-h-12 w-full cursor-pointer items-center justify-between rounded-[12px] px-4 text-left text-sm font-medium transition-[background-color,transform] duration-150 hover:bg-[var(--theme-foreground)]/[0.06] hover:translate-x-0.5 active:scale-[0.99]"
              [class.bg-[var(--theme-accent-content)]/12]="value() === slot"
              [class.text-[var(--theme-accent-content)]]="value() === slot"
              [class.font-semibold]="value() === slot"
              [class.text-[var(--theme-foreground)]]="value() !== slot"
            >
              <span>{{ slot }}</span>
              @if (value() === slot) {
                <span class="material-symbols-rounded text-lg text-[var(--theme-accent-content)]" aria-hidden="true">
                  check
                </span>
              }
            </button>
          }
        </div>
      </div>
    } @else {
      <div
        #popoverEl
        role="dialog"
        aria-label="Elegir horario"
        class="fixed z-[100] rounded-[16px] border border-[var(--theme-border)]/60 bg-[var(--theme-surface)] p-1.5 shadow-[0_8px_20px_-4px_rgba(0,0,0,0.1),0_2px_6px_-2px_rgba(0,0,0,0.05)] backdrop-blur-md dark:shadow-[0_16px_32px_-8px_rgba(0,0,0,0.6)]"
        [style.top]="popoverPosition().top"
        [style.bottom]="popoverPosition().bottom"
        [style.left]="popoverPosition().left"
        [style.width]="popoverPosition().width"
      >
        <div class="mb-1 flex items-center gap-1.5 rounded-[9px] bg-[var(--theme-surface-high)] px-2.5 py-1.5">
          <span class="material-symbols-rounded text-sm text-[var(--theme-muted)]" aria-hidden="true">edit</span>
          <input
            type="text"
            [value]="customInput()"
            (input)="onCustomInputChange($event)"
            placeholder="Ej. 18:30"
            maxlength="5"
            class="min-w-0 flex-1 bg-transparent text-xs font-semibold text-[var(--theme-foreground)] outline-none placeholder:text-[var(--theme-muted)]"
          />
        </div>

        <div role="listbox" class="slots-container no-scrollbar max-h-56 overflow-y-auto space-y-0.5">
          @for (slot of timeSlots(); track slot) {
            <button
              type="button"
              role="option"
              [attr.aria-selected]="value() === slot"
              (click)="selectTime(slot)"
              class="flex min-h-9 w-full cursor-pointer items-center justify-between rounded-[8px] px-2.5 text-xs font-medium transition-[background-color,transform] duration-150 hover:bg-[var(--theme-foreground)]/[0.06] hover:translate-x-0.5"
              [class.is-selected]="value() === slot"
              [class.bg-[var(--theme-accent-content)]/12]="value() === slot"
              [class.text-[var(--theme-accent-content)]]="value() === slot"
              [class.font-semibold]="value() === slot"
              [class.text-[var(--theme-foreground)]]="value() !== slot"
            >
              <span>{{ slot }}</span>
              @if (value() === slot) {
                <span class="material-symbols-rounded text-sm text-[var(--theme-accent-content)]" aria-hidden="true">
                  check
                </span>
              }
            </button>
          }
        </div>
      </div>
    }
  }
</div>
